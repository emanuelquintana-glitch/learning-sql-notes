name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verificar symlinks org
      run: |
        for f in org/*.org; do
          [ -L "$f" ] && echo "OK: $f" || echo "ERROR: $f no es symlink"
        done
    - name: Verificar scripts
      run: bash -n scripts/sync_org.sh && bash -n scripts/export_latex.sh
